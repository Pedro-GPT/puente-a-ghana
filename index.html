<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Puente a Ghana</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#3aa6c9;color:#2b2140;font-family:"Trebuchet MS","Segoe UI",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%}
[hidden]{display:none!important}
#hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#fff8e8;border:3px solid #2b2140;border-radius:18px;padding:8px 12px}
.hueco{width:58px;text-align:center;font-size:12px;font-weight:700}
.hueco canvas{width:44px;height:44px;display:block;margin:auto;filter:grayscale(1);opacity:.28}
.hueco.si canvas{filter:none;opacity:1}
#aviso{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#2b2140;color:#fff;padding:10px 20px;border-radius:22px;font-weight:700;width:max-content;max-width:92vw;text-align:center}
#inicio{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#fff8e8e8;text-align:center;padding:20px}
h1{font-size:clamp(38px,8vw,84px);margin:0;color:#d8433f}
#inicio p{margin:0;max-width:560px;line-height:1.5;font-size:18px}
button{font:inherit;font-weight:700;border:3px solid #2b2140;background:#ffc93c;color:#2b2140;cursor:pointer}
#jugar{font-size:22px;padding:12px 44px;border-radius:30px}
#palanca{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:#2b214055;touch-action:none}
#palanca i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:#fff}
#accion{position:fixed;right:28px;bottom:44px;width:96px;height:96px;border-radius:50%;font-size:15px;padding:0;touch-action:none}
@media(pointer:coarse){#aviso{bottom:170px}}
@media(max-width:480px){.hueco{width:48px}#hud{gap:3px;padding:6px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" hidden></div><div id="aviso" hidden></div>
<div id="palanca" hidden><i></i></div><button id="accion" hidden>BUSCAR</button>
<div id="inicio"><h1>Puente a Ghana</h1>
<p>Busca por la clase los 5 materiales del grupo. Con cada uno se construye un quinto del puente a Ghana.</p>
<p><b>WASD</b> o <b>flechas</b> para mover al grupo, mantén <b>E</b> o <b>espacio</b> para buscar.</p><button id="jugar">Jugar</button></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), cv=$('c'), c=cv.getContext('2d'), TAU=Math.PI*2;
const lim=(v,a,b)=>Math.max(a,Math.min(b,v)), suave=t=>{t=lim(t,0,1);return t*t*(3-2*t)};
const TINTA='#2b2140';
let W,H,D;
function medir(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D}
addEventListener('resize',medir);medir();

// ---------- DATOS (lo que se cambia con facilidad) ----------
const MATERIALES=[{id:'regla',n:'Regla',art:'la regla'},{id:'sacapuntas',n:'Sacapuntas',art:'el sacapuntas'},{id:'lapiz',n:'Lápiz',art:'el lápiz'},{id:'goma',n:'Goma',art:'la goma'},{id:'cuaderno',n:'Cuaderno',art:'el cuaderno'}];
// r = zona del puente [x,y,ancho,alto]; av = quintos construidos (con decimales mientras se construye)
const PU={r:[1430,408,970,124],av:0}, ISLA={x:2720,y:470,rx:390,ry:300}, MONTON={x:2545,y:500};
const CA={on:false,t:0,x:1535,y:470,visto:false}; // carro: aparece al acabar el puente y solo se empuja hacia delante
const NINOS=[ // tres niñas y dos niños
 {piel:'#f6d3b3',pelo:'#f2c14e',pein:'coletas',ropa:'#e8584f',pant:'#34507e',moch:'#3f8fe0',nina:1,dx:-32,dy:-18,f:0},
 {piel:'#e3ac7e',pelo:'#211718',ropa:'#f6b93b',pant:'#54412f',moch:'#39a86b',nina:0,dx:32,dy:-18,f:1.7},
 {piel:'#c98a5c',pelo:'#211718',pein:'mono',ropa:'#58b8a6',pant:'#6a4a8c',moch:'#e2679b',nina:1,dx:0,dy:0,f:3.1},
 {piel:'#f2c39b',pelo:'#b27a42',ropa:'#5f7fd6',pant:'#4a4a55',moch:'#f08a3c',nina:0,dx:-32,dy:18,f:4.6},
 {piel:'#f2c39b',pelo:'#6b3a1e',pein:'larga',ropa:'#a673d8',pant:'#34507e',moch:'#ffc93c',nina:1,dx:32,dy:18,f:5.7}];
const NM=NINOS.length;
const PIELES=['#6b4028','#7d4a2c','#5d3824','#8a5535'], COL=['#e8584f','#3f8fe0','#ffc93c','#39a86b','#8a4fc4','#f08a3c','#e2679b','#58b8a6'];
const GENTE=[[2730,405],[2810,400],[2890,405],[2965,410],[2705,485],[2790,480],[2875,488],[2960,480],[2700,570],[2780,575],[2860,572],[2935,565]]
 .map(([x,y],i)=>({x,y,esc:[1,1,1.28,1][(i*3+1)%4],tiene:false,salto:0,n:{piel:PIELES[i%4],pelo:'#1d1416',pein:i%2?['coletas','mono'][i>>1&1]:'',ropa:COL[(i*3+2)%8],pant:'#4c4660',moch:COL[i%8],nina:i%2,f:i*1.3}}));
const MUEBLES=[];
const mu=(n,tipo,x,y,w,h,z,col)=>MUEBLES.push({n,tipo,x,y,w,h,z,col,mirado:false,item:-1,bote:0});
mu('la estantería','estante',120,100,220,50,130,'#b9763f');
mu('el armario','armario',1140,100,180,50,140,'#5b9aa8');
mu('la mesa del profe','mesa',640,230,240,80,52,'#a8683a');
mu('las taquillas','taquilla',48,430,64,160,90,'#4f86c6');
mu('la mesa de arte','arte',1310,660,120,150,44,'#e9d3a6');
mu('la papelera','papelera',1000,250,48,42,46,'#7c8796');
mu('la caja de libros','caja',330,850,130,66,46,'#e2679b');
mu('el baúl','baul',1060,850,150,70,56,'#8a4fc4');
for(const y of[450,630])for(const x of[330,680,1030])mu('el pupitre','pupitre',x,y,140,64,44,'#eab868');

const G={x:750,y:400,dir:'down',anda:0,t:0,emp:0,tira:false};
const EMPUJE=[[32,-36],[32,36],[32,0],[-10,-19],[-10,19]]; // sitios de los niños detrás del carro
const K=NINOS.map(()=>({x:0,y:0,dir:'down',anda:0,act:'',lanza:0}));
let fin=null, acabado=false;
let estado='inicio', cogidos=0, ev=null, busca=null, cerca=null, avisoT=0, reloj=0;
const cam={x:750,y:450,s:1}, part=[];

// ---------- SUELO Y CHOQUES ----------
const dentro=(x,y,r)=>x>=r[0]&&x<=r[0]+r[2]&&y>=r[1]&&y<=r[1]+r[3];
function pisable(x,y){
  return dentro(x,y,[40,112,1420,850])||cogidos>=5&&!ev&&(dentro(x,y,PU.r)||((x-ISLA.x)/(ISLA.rx-12))**2+((y-ISLA.y)/(ISLA.ry-12))**2<1&&!dentro(x,y,[2685,240,150,72]));
}
const HX=50,HY=28;
function cabe(x,y){
  for(const a of[-1,0,1])for(const b of[-1,0,1])if(!pisable(x+a*HX,y+b*HY))return false;
  if(CA.on&&x+HX>CA.x-58&&x-HX<CA.x+58&&Math.abs(y-CA.y)<HY+45)return false;
  for(const m of MUEBLES)if(x+HX>m.x&&x-HX<m.x+m.w&&y+HY>m.y&&y-HY<m.y+m.h)return false;
  return true;
}
const dist=m=>Math.hypot(Math.max(m.x-G.x,0,G.x-m.x-m.w),Math.max(m.y-G.y,0,G.y-m.y-m.h));
function repartir(){
  const l=MUEBLES.map((_,i)=>i);
  for(let i=l.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[l[i],l[j]]=[l[j],l[i]]}
  // los cinco, en muebles distintos y como mucho uno en los pupitres de cada partida
  let pup=0,k=0;
  for(const i of l){if(k>=5)break;if(MUEBLES[i].tipo==='pupitre'&&pup++)continue;MUEBLES[i].item=k++}
}
repartir();

// ---------- SONIDO ----------
let ac;
function nota(f,d=.15,t=0,tipo='triangle',v=.12){
  if(!ac)return;const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;
  o.type=tipo;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);
  o.connect(g).connect(ac.destination);o.start(n);o.stop(n+d);
}

// ---------- ENTRADA ----------
const T=new Set(), pal={x:0,y:0};
addEventListener('keydown',e=>{
  if(/^(Arrow|Space)/.test(e.code))e.preventDefault();
  if(estado==='inicio'){if(e.code==='Enter'||e.code==='Space')empezar();return}
  T.add(e.code);if(!e.repeat&&(e.code==='KeyE'||e.code==='Space'))buscar();
});
addEventListener('keyup',e=>T.delete(e.code));addEventListener('blur',()=>T.clear());
const P=$('palanca');
function mover(e){const r=P.getBoundingClientRect();let x=(e.clientX-r.left-65)/50,y=(e.clientY-r.top-65)/50;const l=Math.max(1,Math.hypot(x,y));pal.x=x/l;pal.y=y/l;P.firstChild.style.transform=`translate(${pal.x*38}px,${pal.y*38}px)`}
P.onpointerdown=e=>{P.setPointerCapture(e.pointerId);mover(e)};P.onpointermove=e=>{if(P.hasPointerCapture(e.pointerId))mover(e)};
P.onpointerup=P.onpointercancel=()=>{pal.x=pal.y=0;P.firstChild.style.transform=''};
let boton=false;
$('accion').onpointerdown=e=>{e.preventDefault();$('accion').setPointerCapture(e.pointerId);boton=true;buscar()};
$('accion').onpointerup=$('accion').onpointercancel=()=>boton=false;
const pulsado=()=>boton||T.has('KeyE')||T.has('Space');
$('jugar').onclick=empezar;
function empezar(){
  if(estado!=='inicio')return;estado='juego';$('inicio').hidden=true;$('hud').hidden=false;$('jugar').blur();
  try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(_){}
  if(matchMedia('(pointer:coarse)').matches){P.hidden=false;$('accion').hidden=false}
}
function aviso(t,s=2.4){$('aviso').textContent=t;$('aviso').hidden=false;avisoT=s}
function humo(x,y){for(let i=0;i<36;i++){const a=Math.random()*TAU,v=60+Math.random()*170;part.push({x:x+Math.cos(a)*30,y:y+Math.sin(a)*18,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,t:0,c:i%3?'#fff8e8':COL[i%8]})}}
function buscar(){if(estado==='juego'&&!ev&&!fin&&!busca&&cerca){busca={m:cerca,t:0,vuelve:0,rutas:rutas(cerca)};nota(220,.1)}}
// Reparte a los niños por el contorno del mueble. Cada ruta es una línea de puntos que lo rodea sin atravesarlo.
function rutas(m){
  const X0=m.x-26,Y0=m.y-8,w=m.w+52,h=m.h+30,pe=2*(w+h),N=72,pt=[];
  for(let i=0;i<N;i++){let d=i/N*pe;
    if(d<w)pt.push([X0+d,Y0]);else if((d-=w)<h)pt.push([X0+w,Y0+d]);else if((d-=h)<w)pt.push([X0+w-d,Y0+h]);else pt.push([X0,Y0+h-(d-w)])}
  const ok=pt.map(([x,y])=>pisable(x,y)&&!MUEBLES.some(o=>o!==m&&x>o.x-8&&x<o.x+o.w+8&&y>o.y-4&&y<o.y+o.h+4));
  let ini=0;for(let i=0;i<N;i++)if(ok[i]&&!ok[(i+N-1)%N])ini=i; // empezar justo después del hueco (la pared)
  const val=[];for(let i=0;i<N;i++)if(ok[(ini+i)%N])val.push((ini+i)%N);
  const todo=val.length===N, meta=[];
  for(let i=0;i<NM;i++)meta.push(val[Math.round(todo?i*N/NM:i*(val.length-1)/(NM-1))%val.length]);
  const cam1=K.map(k=>{let b=val[0],bd=1e9;for(const i of val){const d=Math.hypot(pt[i][0]-k.x,pt[i][1]-k.y);if(d<bd){bd=d;b=i}}
    return meta.map(g=>{let mejor=null;for(const s of[1,-1]){const c=[b];let bien=true;for(let i=b;i!==g;){i=(i+s+N)%N;if(!ok[i])bien=false;c.push(i)}
      if(bien&&(!mejor||c.length<mejor.length))mejor=c}return mejor||[b,g]})});
  let mejor=null,mc=1e9; // quién va a cada sitio: el reparto con menos camino
  (function prueba(i,us,ct){if(ct>=mc)return;if(i===NM){mc=ct;mejor=us.slice();return}
    for(let g=0;g<NM;g++)if(!us.includes(g))prueba(i+1,us.concat(g),ct+cam1[i][g].length)})(0,[],0);
  return K.map((k,i)=>{const p=[[k.x,k.y],...cam1[i][mejor[i]].map(j=>pt[j])],L=[0];
    for(let j=1;j<p.length;j++)L.push(L[j-1]+Math.hypot(p[j][0]-p[j-1][0],p[j][1]-p[j-1][1]));
    return{p,L,s:0,tot:L[L.length-1]}});
}
function irA(k,x,y,dt,v){ // camina hacia un punto; true si ha llegado
  const dx=x-k.x,dy=y-k.y,d=Math.hypot(dx,dy);
  if(d<1){k.anda=0;return true}
  k.anda=1;mirar(k,dx,dy);const q=Math.min(1,v*dt/d);k.x+=dx*q;k.y+=dy*q;return false;
}
function mirar(k,dx,dy){if(Math.abs(dx)+Math.abs(dy)>.5)k.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
function formar(){K.forEach((k,i)=>{const e=suave(G.emp),n=NINOS[i],p=EMPUJE[i];
  k.x=G.x+n.dx+(p[0]-n.dx)*e;k.y=G.y+n.dy+(p[1]-n.dy)*e;k.dir=G.dir;k.anda=G.anda;k.act=G.tira?'empuja':''})}
function buscando(dt){
  const b=busca,m=b.m;G.t+=dt*13;
  if(!b.vuelve){b.t+=dt;m.bote=1;if(b.t>.75)b.vuelve=2;else if(!pulsado())b.vuelve=1}
  let lejos=false;
  K.forEach((k,i)=>{const r=b.rutas[i],ax=k.x,ay=k.y;
    r.s=lim(r.s+(b.vuelve?-1:1)*dt*Math.max(520,r.tot/.4),0,r.tot);
    let j=1;while(j<r.p.length-1&&r.L[j]<r.s)j++;
    const q=(r.s-r.L[j-1])/((r.L[j]-r.L[j-1])||1);
    k.x=r.p[j-1][0]+(r.p[j][0]-r.p[j-1][0])*q;k.y=r.p[j-1][1]+(r.p[j][1]-r.p[j-1][1])*q;
    const llego=!b.vuelve&&r.s>=r.tot;k.anda=llego?0:1;k.act=llego?'busca':'';
    if(llego)mirar(k,lim(k.x,m.x,m.x+m.w)-k.x,lim(k.y,m.y,m.y+m.h)-k.y);else mirar(k,(k.x-ax)*9,(k.y-ay)*9);
    if(r.s>0)lejos=true});
  if(!b.vuelve||lejos)return;
  busca=null;formar();
  if(b.vuelve===1)return; // soltó la tecla antes de tiempo
  m.mirado=true;
  if(m.item>=0){ev={t:0,k:m.item,x:m.x+m.w/2,y:m.y-m.z+10,fase:0};nota(523,.2);nota(659,.2,.1);nota(784,.35,.2)}
  else{aviso('En '+m.n+' no hay nada.');nota(150,.2)}
}
// ---------- FINAL: lanzar las mochilas ----------
const SITIOS=[[2480,455],[2545,440],[2450,515],[2480,575],[2555,580]];
function final(dt){
  const f=fin;f.t+=dt;
  if(f.t<0){K.forEach(k=>{k.anda=0;k.act=''});return[2640,455]} // el carro acaba de convertirse en el montón
  G.emp=0;G.t+=dt*10;
  if(f.t<9.6){
    K.forEach((k,i)=>{if(irA(k,SITIOS[i][0],SITIOS[i][1],dt,230))k.dir='right';k.act=''});
    if(f.n===0&&f.t<.06)aviso('¡Mochilas para todos!',3);
    while(f.n<GENTE.length&&f.t>2+f.n*.48){const i=f.n++,a=K[i%NM],b=GENTE[i];
      f.vuelo.push({x0:a.x+10,y0:a.y-62,g:b,t:0});a.lanza=.4;nota(330+i*25,.14)}
    for(const v of f.vuelo)if(v.t<1){v.t+=dt/.85;if(v.t>=1){v.g.tiene=true;v.g.salto=1;nota(700,.16,0,'sine')}}
    if(f.t>8.6)K.forEach(k=>{k.act='feliz';k.dir='down'});
    if(f.t>8.6&&!f.msg){f.msg=1;aviso('¡Todos tienen su mochila! Gracias por tender el puente.',6);[523,659,784,1047].forEach((n,i)=>nota(n,.4,i*.15));
      for(let i=0;i<60;i++)part.push({x:2500+Math.random()*460,y:330+Math.random()*100,vx:(Math.random()-.5)*120,vy:-60-Math.random()*160,t:-Math.random()*.5,c:COL[i%8]})}
  }else if(f.t>11){
    let ok=true;G.x=2500;G.y=470;G.dir='down';K.forEach((k,i)=>{k.act='';if(!irA(k,G.x+NINOS[i].dx,G.y+NINOS[i].dy,dt,200))ok=false});
    if(ok){fin=null;acabado=true;formar()}
  }
  return[2715,455];
}

// ---------- LÓGICA ----------
function paso(dt){
  reloj+=dt;
  for(const p of part){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt}
  for(let i=part.length;i--;)if(part[i].t>.9)part.splice(i,1);
  for(const m of MUEBLES)m.bote=Math.max(0,m.bote-dt*2);
  for(const k of K)k.lanza=Math.max(0,k.lanza-dt);
  for(const g of GENTE)g.salto=Math.max(0,g.salto-dt*.9);
  if(estado==='inicio')formar();
  let cx=G.x,cy=G.y-20;G.anda=0;
  if(estado==='juego'){
    if(ev){const r=evento(dt);if(r){cx=r[0];cy=r[1]}}
    else if(fin){const r=final(dt);cx=r[0];cy=r[1]}
    else if(CA.on&&CA.t<2.6){ // aparición de repente
      cerca=null;CA.t+=dt;cx=CA.x;cy=CA.y;G.emp=0;formar();
      if(CA.t>1.1&&!CA.visto){CA.visto=true;humo(CA.x,CA.y);aviso('¡Un carro lleno de mochilas! Empujadlo hasta Ghana.',5);nota(392,.2);nota(587,.35,.1)}
    }
    else if(busca)buscando(dt);
    else{
      const k=(a,b)=>T.has(a)||T.has(b)?1:0;
      let x=k('KeyD','ArrowRight')-k('KeyA','ArrowLeft')+pal.x,y=k('KeyS','ArrowDown')-k('KeyW','ArrowUp')+pal.y;
      if(CA.on&&CA.x>2420){x=1;y=0} // último tramo, solos
      const l=Math.hypot(x,y);
      G.tira=false;
      if(l>.15){const q=Math.max(1,l);x/=q;y/=q;
        G.anda=1;G.t+=dt*10;
        G.dir=Math.abs(x)>Math.abs(y)?(x>0?'right':'left'):(y>0?'down':'up');
        const v=300*dt;
        if(cabe(G.x+x*v,G.y))G.x+=x*v;
        else if(CA.on&&x>.3&&G.x<CA.x&&CA.x-58-G.x-HX<v+4&&Math.abs(G.y-CA.y)<60){
          G.tira=true;G.dir='right';const d=x*170*dt,antes=CA.x;
          CA.x+=d;G.x=CA.x-58-HX-.5;G.y+=(CA.y-G.y)*Math.min(1,dt*6);y=0;
          if(Math.floor(CA.x/45)>Math.floor(antes/45))nota(120+Math.random()*25,.07,0,'square',.03);
          if(CA.x>=MONTON.x){CA.on=false;G.tira=false;humo(MONTON.x,MONTON.y-30);nota(587,.2);nota(784,.35,.1);fin={t:-1.2,n:0,vuelo:[],msg:0};cerca=null}
        }
        if(cabe(G.x,G.y+y*v))G.y+=y*v;
      }
      G.emp=lim(G.emp+(G.tira?dt:-dt)*4,0,1);
      if(!fin)formar();
      if(cogidos<5&&G.x>1385&&Math.abs(G.y-470)<70)aviso('Puente a Ghana: '+cogidos+'/5. Aún no se puede cruzar.',.3);
      cerca=null;let md=78;
      for(const m of MUEBLES){const d=dist(m);if(!m.mirado&&d<md){md=d;cerca=m}}
    }
    if(avisoT>0)avisoT-=dt;
    else if(cerca&&!ev&&!busca&&!fin){const mv=!$('accion').hidden;$('aviso').textContent='Mantén '+(mv?'BUSCAR':'E')+' · Mirar en '+cerca.n;$('aviso').hidden=false}
    else $('aviso').hidden=true;
  }
